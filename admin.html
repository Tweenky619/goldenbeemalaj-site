<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · Goldenbee MALAJ</title>
<style>
  :root {
    --gold: #C9A227;
    --gold-light: #E8C766;
    --dark: #1a1611;
    --dark-2: #262019;
    --cream: #FAF6EC;
    --muted: #6b6252;
    --border: #3a3020;
    --border-2: #4a3f2c;
    --blue: #5b9bd5;
    --green: #6abf69;
    --green-dark: #3d8b3d;
    --gray: #7a7268;
    --red-soft: #e8a08a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; background: var(--dark); color: var(--cream); min-height: 100vh; }

  /* ── Login ─────────────────────────────────────── */
  #loginScreen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-box { background: var(--dark-2); border: 1px solid var(--border); border-radius: 12px; padding: 2.5rem 2rem; width: 320px; text-align: center; }
  .login-bee { font-size: 2.4rem; margin-bottom: 0.4rem; }
  .login-box h1 { color: var(--gold-light); font-size: 1.25rem; margin-bottom: 0.25rem; }
  .login-box .sub { color: var(--muted); font-size: 0.88rem; margin-bottom: 1.8rem; }
  .login-box input[type="password"] {
    width: 100%; padding: 0.75rem 1rem;
    background: var(--dark); border: 1px solid var(--border-2); border-radius: 6px;
    color: var(--cream); font-size: 1rem; margin-bottom: 0.75rem; display: block;
  }
  .login-box input[type="password"]:focus { outline: 2px solid var(--gold); border-color: var(--gold); }
  .login-box button[type="submit"] {
    width: 100%; padding: 0.8rem; background: var(--gold); color: var(--dark);
    border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer;
  }
  .login-box button[type="submit"]:hover { background: var(--gold-light); }
  .login-box button[type="submit"]:disabled { opacity: 0.6; cursor: default; }
  .login-err { color: var(--red-soft); font-size: 0.88rem; margin-top: 0.6rem; min-height: 1.2em; }

  /* ── Dashboard ──────────────────────────────────── */
  #dashboard { display: flex; flex-direction: column; min-height: 100vh; }
  header {
    background: var(--dark-2); border-bottom: 1px solid var(--border);
    padding: 0.8rem 1.5rem; display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 0.5rem; position: sticky; top: 0; z-index: 10;
  }
  .header-title { color: var(--gold-light); font-size: 1.05rem; font-weight: bold; }
  .header-actions { display: flex; gap: 0.5rem; align-items: center; }
  .btn-sm {
    padding: 0.35rem 0.75rem; border-radius: 6px; font-size: 0.85rem; cursor: pointer;
    border: 1px solid var(--border-2); background: transparent; color: var(--cream);
  }
  .btn-sm:hover { border-color: var(--gold); color: var(--gold-light); }
  .btn-logout { color: var(--muted); }
  .btn-logout:hover { color: var(--red-soft); border-color: var(--red-soft); }

  /* ── Stats row ──────────────────────────────────── */
  .stats { display: flex; gap: 0.75rem; padding: 1.2rem 1.5rem 0.5rem; flex-wrap: wrap; }
  .stat {
    background: var(--dark-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 0.9rem 1.2rem; flex: 1; min-width: 100px; text-align: center;
  }
  .stat .num { font-size: 1.9rem; font-weight: bold; line-height: 1; }
  .stat .lbl { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 0.25rem; }
  .stat.s-total .num { color: var(--gold-light); }
  .stat.s-new .num { color: var(--gold); }
  .stat.s-contacted .num { color: var(--blue); }
  .stat.s-confirmed .num { color: var(--green); }
  .stat.s-completed .num { color: var(--green-dark); }
  .stat.s-abandoned .num { color: var(--red-soft); }

  /* ── Controls ───────────────────────────────────── */
  .controls { display: flex; gap: 0.6rem; padding: 0.8rem 1.5rem; flex-wrap: wrap; align-items: center; }
  .controls label { font-size: 0.82rem; color: var(--muted); }
  .controls select {
    padding: 0.4rem 0.7rem; background: var(--dark-2); border: 1px solid var(--border-2);
    border-radius: 6px; color: var(--cream); font-size: 0.88rem; cursor: pointer;
  }
  .controls select:focus { outline: 2px solid var(--gold); }

  /* ── Table ──────────────────────────────────────── */
  .table-wrap { overflow-x: auto; padding: 0 1.5rem 2rem; flex: 1; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; min-width: 700px; }
  thead th {
    text-align: left; padding: 0.65rem 0.75rem; color: var(--gold);
    font-size: 0.73rem; text-transform: uppercase; letter-spacing: 0.07em;
    border-bottom: 1px solid var(--border); white-space: nowrap; font-weight: bold;
  }
  tbody tr { border-bottom: 1px solid #2a2218; transition: background 0.1s; }
  tbody tr:hover { background: rgba(201,162,39,0.05); }
  tbody td { padding: 0.7rem 0.75rem; vertical-align: top; }
  .c-id { color: var(--muted); font-size: 0.78rem; white-space: nowrap; }
  .c-date { white-space: nowrap; }
  .c-date-main { font-size: 0.85rem; }
  .c-date-time { font-size: 0.75rem; color: var(--muted); }
  .c-name { font-weight: bold; }
  .c-contact { color: #b5a990; font-size: 0.85rem; }
  .c-interest { color: #c8bda0; font-size: 0.85rem; max-width: 200px; word-break: break-word; }
  .c-time { color: var(--muted); font-size: 0.82rem; white-space: nowrap; }

  /* Source badge */
  .src { display: inline-block; padding: 0.15rem 0.45rem; border-radius: 3px; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
  .src-exchange { background: rgba(201,162,39,0.15); color: var(--gold); }
  .src-main { background: rgba(91,155,213,0.15); color: var(--blue); }

  /* Status select */
  .status-sel {
    border: 1px solid; border-radius: 4px; padding: 0.28rem 0.5rem;
    font-size: 0.8rem; font-weight: bold; cursor: pointer;
    background: transparent; min-width: 100px;
    appearance: auto;
  }
  .status-sel:focus { outline: none; box-shadow: 0 0 0 2px rgba(201,162,39,0.4); }
  .s-new       { color: var(--gold);       border-color: var(--gold); }
  .s-contacted { color: var(--blue);       border-color: var(--blue); }
  .s-confirmed { color: var(--green);      border-color: var(--green); }
  .s-completed { color: var(--green-dark); border-color: var(--green-dark); }
  .s-no-reply  { color: var(--gray);       border-color: var(--gray); }
  .s-abandoned { color: var(--red-soft);   border-color: var(--red-soft); }

  /* State messages */
  .msg-center { text-align: center; padding: 4rem 1rem; color: var(--muted); font-size: 0.95rem; }
  .msg-err { color: var(--red-soft); }

  /* Saving indicator */
  .saving { opacity: 0.5; pointer-events: none; }

  [hidden] { display: none !important; }
</style>
</head>
<body>

<!-- ─── LOGIN ─── -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-bee">🐝</div>
    <h1>Goldenbee MALAJ</h1>
    <p class="sub">Admin Dashboard</p>
    <form id="loginForm" autocomplete="on">
      <input type="password" id="pwInput" placeholder="Admin password" autocomplete="current-password">
      <button type="submit" id="loginBtn">Sign In</button>
      <div class="login-err" id="loginErr"></div>
    </form>
  </div>
</div>

<!-- ─── DASHBOARD ─── -->
<div id="dashboard" hidden>
  <header>
    <span class="header-title">🐝 Goldenbee MALAJ &nbsp;·&nbsp; Leads</span>
    <div class="header-actions">
      <button class="btn-sm" id="refreshBtn">↻ Refresh</button>
      <button class="btn-sm btn-logout" id="logoutBtn">Log out</button>
    </div>
  </header>

  <div class="stats">
    <div class="stat s-total"><div class="num" id="sTot">–</div><div class="lbl">Total</div></div>
    <div class="stat s-new"><div class="num" id="sNew">–</div><div class="lbl">New</div></div>
    <div class="stat s-contacted"><div class="num" id="sCon">–</div><div class="lbl">Contacted</div></div>
    <div class="stat s-confirmed"><div class="num" id="sCfm">–</div><div class="lbl">Confirmed</div></div>
    <div class="stat s-completed"><div class="num" id="sCmp">–</div><div class="lbl">Completed</div></div>
    <div class="stat s-abandoned"><div class="num" id="sAbd">–</div><div class="lbl">Abandoned</div></div>
  </div>

  <div class="controls">
    <label for="fStatus">Status:</label>
    <select id="fStatus">
      <option value="all">All</option>
      <option value="new">New</option>
      <option value="contacted">Contacted</option>
      <option value="confirmed">Confirmed</option>
      <option value="completed">Completed</option>
      <option value="no-reply">No Reply</option>
      <option value="abandoned">Abandoned</option>
    </select>
    <label for="fSource">Source:</label>
    <select id="fSource">
      <option value="all">All Sources</option>
      <option value="exchange">Exchange App</option>
      <option value="main">Main Site</option>
    </select>
  </div>

  <div class="table-wrap">
    <div id="msgLoading" class="msg-center">Loading…</div>
    <div id="msgEmpty"   class="msg-center" hidden>No leads match this filter.</div>
    <div id="msgErr"     class="msg-center msg-err" hidden></div>
    <table id="leadsTable" hidden>
      <thead>
        <tr>
          <th>#</th>
          <th>Date</th>
          <th>Source</th>
          <th>Name</th>
          <th>Contact</th>
          <th>Interest / Notes</th>
          <th>Best Time</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="leadsBody"></tbody>
    </table>
  </div>
</div>

<script>
(function () {
  'use strict';

  var TOKEN_KEY = 'gbm_admin_tok';
  var STATUSES = ['new', 'contacted', 'confirmed', 'completed', 'no-reply', 'abandoned'];
  var STATUS_LABELS = { 'new': 'New', 'contacted': 'Contacted', 'confirmed': 'Confirmed', 'completed': 'Completed', 'no-reply': 'No Reply', 'abandoned': 'Abandoned' };

  var token = sessionStorage.getItem(TOKEN_KEY);
  var allLeads = [];

  // ── Boot ──────────────────────────────────────────
  if (token) enterDashboard();

  // ── Login ─────────────────────────────────────────
  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = document.getElementById('pwInput').value.trim();
    var btn = document.getElementById('loginBtn');
    var err = document.getElementById('loginErr');
    if (!pw) return;
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    err.textContent = '';

    // Validate by attempting a real API call — avoids sending the password in a response body.
    apiFetch('/api/admin/leads?limit=1', 'GET', null, pw)
      .then(function (res) {
        if (res && res.ok !== false) {
          sessionStorage.setItem(TOKEN_KEY, pw);
          token = pw;
          enterDashboard();
        } else {
          err.textContent = 'Wrong password.';
          btn.disabled = false;
          btn.textContent = 'Sign In';
        }
      })
      .catch(function (statusCode) {
        if (statusCode === 401) {
          err.textContent = 'Wrong password.';
        } else {
          err.textContent = 'Could not connect — try again.';
        }
        btn.disabled = false;
        btn.textContent = 'Sign In';
      });
  });

  // ── Dashboard actions ─────────────────────────────
  document.getElementById('logoutBtn').addEventListener('click', function () {
    sessionStorage.removeItem(TOKEN_KEY);
    token = null;
    document.getElementById('dashboard').hidden = true;
    document.getElementById('loginScreen').style.display = '';
  });

  document.getElementById('refreshBtn').addEventListener('click', loadLeads);
  document.getElementById('fStatus').addEventListener('change', renderVisible);
  document.getElementById('fSource').addEventListener('change', renderVisible);

  // ── Enter dashboard ───────────────────────────────
  function enterDashboard() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').hidden = false;
    loadLeads();
  }

  // ── Load leads ────────────────────────────────────
  function loadLeads() {
    show('msgLoading');
    hide('leadsTable');
    hide('msgEmpty');
    hide('msgErr');

    apiFetch('/api/admin/leads?limit=500', 'GET', null, token)
      .then(function (res) {
        allLeads = res.leads || [];
        renderStats();
        renderVisible();
      })
      .catch(function (code) {
        if (code === 401) {
          sessionStorage.removeItem(TOKEN_KEY);
          location.reload();
        } else {
          hide('msgLoading');
          document.getElementById('msgErr').textContent = 'Failed to load leads. Try refreshing.';
          show('msgErr');
        }
      });
  }

  // ── Stats ─────────────────────────────────────────
  function renderStats() {
    var counts = { total: allLeads.length, 'new': 0, contacted: 0, confirmed: 0, completed: 0, abandoned: 0 };
    allLeads.forEach(function (l) { if (counts[l.status] !== undefined) counts[l.status]++; });
    document.getElementById('sTot').textContent = counts.total;
    document.getElementById('sNew').textContent = counts['new'];
    document.getElementById('sCon').textContent = counts.contacted;
    document.getElementById('sCfm').textContent = counts.confirmed;
    document.getElementById('sCmp').textContent = counts.completed;
    document.getElementById('sAbd').textContent = counts.abandoned;
  }

  // ── Filter + render ───────────────────────────────
  function renderVisible() {
    var fStatus = document.getElementById('fStatus').value;
    var fSource = document.getElementById('fSource').value;

    var filtered = allLeads.filter(function (l) {
      if (fStatus !== 'all' && l.status !== fStatus) return false;
      if (fSource !== 'all') {
        var isExchange = isExchangeSource(l.source_page);
        if (fSource === 'exchange' && !isExchange) return false;
        if (fSource === 'main' && isExchange) return false;
      }
      return true;
    });

    hide('msgLoading');
    if (filtered.length === 0) {
      hide('leadsTable');
      show('msgEmpty');
      return;
    }
    hide('msgEmpty');

    var tbody = document.getElementById('leadsBody');
    tbody.innerHTML = filtered.map(rowHtml).join('');
    show('leadsTable');

    // Attach status change listeners
    tbody.querySelectorAll('.status-sel').forEach(function (sel) {
      sel.addEventListener('change', function () {
        updateStatus(parseInt(sel.dataset.id, 10), sel.value, sel);
      });
    });
  }

  // ── Row HTML ──────────────────────────────────────
  function rowHtml(lead) {
    var d = fmtDate(lead.created_at);
    var src = isExchangeSource(lead.source_page)
      ? '<span class="src src-exchange">Exchange</span>'
      : '<span class="src src-main">Main</span>';

    var opts = STATUSES.map(function (s) {
      return '<option value="' + s + '"' + (lead.status === s ? ' selected' : '') + '>' + STATUS_LABELS[s] + '</option>';
    }).join('');

    return '<tr>' +
      '<td class="c-id">' + Number(lead.id) + '</td>' +
      '<td class="c-date"><div class="c-date-main">' + d.date + '</div><div class="c-date-time">' + d.time + '</div></td>' +
      '<td>' + src + '</td>' +
      '<td class="c-name">' + esc(lead.name) + '</td>' +
      '<td class="c-contact">' + esc(lead.contact) + '</td>' +
      '<td class="c-interest">' + esc(lead.interest || '–') + '</td>' +
      '<td class="c-time">' + esc(lead.best_time || '–') + '</td>' +
      '<td><select class="status-sel s-' + esc(lead.status) + '" data-id="' + Number(lead.id) + '">' + opts + '</select></td>' +
      '</tr>';
  }

  // ── Status update ─────────────────────────────────
  function updateStatus(id, newStatus, sel) {
    sel.classList.add('saving');
    apiFetch('/api/admin/leads/' + id, 'PATCH', { status: newStatus }, token)
      .then(function () {
        sel.className = 'status-sel s-' + newStatus;
        var lead = allLeads.find(function (l) { return l.id === id; });
        if (lead) { lead.status = newStatus; renderStats(); }
      })
      .catch(function () {
        sel.classList.remove('saving');
        alert('Could not update status — try refreshing.');
      });
  }

  // ── Helpers ───────────────────────────────────────
  function apiFetch(url, method, body, pw) {
    var opts = {
      method: method,
      headers: { 'Authorization': 'Bearer ' + pw }
    };
    if (body) {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(body);
    }
    return fetch(url, opts).then(function (r) {
      if (r.status === 401) return Promise.reject(401);
      return r.json().then(function (data) {
        if (!data.ok) return Promise.reject(r.status);
        return data;
      });
    });
  }

  function isExchangeSource(sp) {
    if (!sp) return false;
    return sp.indexOf('exchange') !== -1;
  }

  function fmtDate(iso) {
    if (!iso) return { date: '–', time: '' };
    try {
      var d = new Date(iso);
      return {
        date: d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
        time: d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })
      };
    } catch (e) { return { date: iso, time: '' }; }
  }

  function esc(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function show(id) { document.getElementById(id).hidden = false; }
  function hide(id) { document.getElementById(id).hidden = true; }
})();
</script>
</body>
</html>
